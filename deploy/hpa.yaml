# Kubernetes Deployment + HPA driven by the queue-depth metric the service
# exports at /metrics. This is the *external* counterpart to the in-process
# autoscaler: the app resizes its own concurrency gate, while the HPA adds and
# removes pods based on the same load signal scraped by Prometheus.
#
# With LLM_LEDGER=redis every pod shares one budget, so scaling out does not
# multiply each user's spending limit by the replica count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference
  template:
    metadata:
      labels:
        app: llm-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Give in-flight generations time to drain before the pod dies; streaming
      # requests can legitimately run for a minute or more.
      terminationGracePeriodSeconds: 120
      containers:
        - name: llm-inference
          image: llm-inference-autoscaling:latest
          ports:
            - containerPort: 8000
          env:
            - name: LLM_MIN_REPLICAS
              value: "1"
            - name: LLM_MAX_REPLICAS
              value: "20"
            - name: LLM_TARGET_CONCURRENCY
              value: "4"
            - name: LLM_LEDGER
              value: "redis"
            - name: LLM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: llm-inference-redis
                  key: url
            - name: LLM_PROVIDER
              value: "vllm"
            - name: LLM_VLLM_BASE_URL
              value: "http://vllm.default.svc.cluster.local:8000"
          # Liveness only checks the process; readiness also checks the cost
          # store, so a pod that cannot enforce budgets leaves the rotation
          # instead of rejecting every request it receives.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-inference
  minReplicas: 1
  maxReplicas: 20
  metrics:
    # Scale on the custom queue-depth gauge (requires prometheus-adapter to
    # surface llm_queue_depth as a pods metric). Queue depth, not CPU: an LLM
    # pod waiting on a GPU is not CPU-busy, so CPU-based scaling under-reacts.
    - type: Pods
      pods:
        metric:
          name: llm_queue_depth
        target:
          type: AverageValue
          averageValue: "4"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      # Slow scale-down matches the in-process cooldown and avoids paying the
      # model-load cold start repeatedly during choppy traffic.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llm-inference
