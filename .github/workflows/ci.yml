name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run for the same ref obsolete.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The service supports 3.10+; the oldest and newest supported versions
        # catch the majority of version-specific breakage.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run the offline demo
        # The demo is the end-to-end smoke test: it exercises routing, budget
        # downgrades, streaming, a billed disconnect, and the autoscaling loop
        # without needing a GPU, Redis, or any API key.
        run: python examples/demo.py
        env:
          PYTHONPATH: .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t llm-inference-autoscaling:ci .
      - name: Smoke-test the image
        # Prove the image actually serves before anything downstream trusts it.
        run: |
          docker run -d --name svc -p 8000:8000 llm-inference-autoscaling:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "service is up"
              curl -sf -X POST http://localhost:8000/v1/infer \
                -H 'content-type: application/json' \
                -d '{"prompt":"say hi","user_id":"ci"}' | tee /dev/stderr | grep -q '"model"'
              docker rm -f svc
              exit 0
            fi
            sleep 2
          done
          echo "service failed to become healthy"
          docker logs svc
          docker rm -f svc
          exit 1
